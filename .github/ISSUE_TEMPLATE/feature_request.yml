name: Feature request
description: Suggest a new feature or enhancement for Viewpoint Arena
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe what you need and why so we can evaluate it.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this feature solve? What limitation are you running into?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like. Be as specific as possible.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      description: Which part of the project does this primarily relate to?
      options:
        - 3D scene / rendering
        - Connector adapters (PLM, notifications, TURN)
        - Capture / insight pipeline
        - UI / UX
        - Deployment / configuration
        - Developer tooling / CI
        - Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, mockups, or references here.
    validations:
      required: false
