[pytest]
# The package lives next to tests/, not installed into site-packages: this puts
# capture-service/ on sys.path so `import capture_service` works from any
# invocation directory (a contributor's shell, or CI's `python -m pytest`).
pythonpath = .
testpaths = tests
addopts = -ra
# No filterwarnings = error: the installed Starlette emits a deprecation notice
# about its own TestClient transport, which is not this service's to fix.
