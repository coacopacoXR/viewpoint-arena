[pytest]
# The package lives next to tests/, not installed into site-packages: this puts
# convert-service/ on sys.path so `import convert_service` works from any
# invocation directory (a contributor's shell, CI, or `docker compose run --rm
# convert-service pytest`).
pythonpath = .
testpaths = tests
addopts = -ra
# No filterwarnings = error: OCP and pygltflib both emit deprecation notices
# about their own internals, which are not this service's to fix.
