# The `app` container: nginx serving the Vite build.
#
# Copied to /etc/nginx/templates/default.conf.template by deploy/app.Dockerfile,
# so the stock nginx entrypoint runs envsubst over it at CONTAINER START and
# writes /etc/nginx/conf.d/default.conf.
#
# This file currently has NO envsubst placeholders, and that is a change worth
# explaining rather than a leftover: it used to substitute the capture shared
# secret into an X-Capture-Token header, because nginx proxied
# /api/capture/local and /api/capture/transcribe straight to capture-service and
# was therefore the layer that had to authenticate to it. Those two paths now go
# to the `api` container (docs/plan/14-rooms-models-admin-ai.md batch BF, so the
# deployment can pick a provider for audio too), and the secret is added there by
# lib/ai/router.ts from the api container's own environment. Keeping the
# placeholder would mean rendering a secret into a config that no longer uses it.
#
# NOTE for whoever adds one back: envsubst does not know what a comment is, so a
# dollar-brace expression ANYWHERE in this file — including in prose like this —
# is substituted from an environment variable nobody set, which means an empty
# string in a directive, which means a config that parses and silently does the
# wrong thing. deploy/__tests__/nginxCaptureTemplate.test.ts counts them and
# fails on a placeholder mentioned only in a comment. Spell it out in words.
#
# The template mechanism stays, and NGINX_ENVSUBST_FILTER is still ^CAPTURE_ in
# deploy/app.Dockerfile: it is what allows this file to keep using nginx's own
# $uri / $host / $proxy_* variables, and it means a future CAPTURE_* placeholder
# is substituted from the environment rather than baked into an image layer.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Recordings, GLB models and the built bundle are large; the compose
    # network is local so this is cheap, and it halves what nginx-proxy has to
    # re-serve over TLS.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        model/gltf+json
        model/gltf-binary;

    # ── the access check the capture endpoints are held to ──────────────────
    #
    # nginx sends the capture locations below through auth_request, which asks
    # this subrequest first and judges it by status alone: 204 lets the request
    # through, 401 refuses it.
    #
    # It matters because those locations spend something — a GPU, a cloud API key,
    # an enterprise gateway's quota — and the api attaches its own upstream
    # credential for every caller. Before this check existed, anyone who could
    # open the origin could make the server transcribe audio and run the LLM even
    # with a front-door password set: the password guarded the UI, the GPU was
    # open.
    #
    # The api enforces the same rule itself (enforceCaptureAccess in
    # api/capture/_request.ts), so this is the second of two doors rather than the
    # only one. Keeping it here is still worth it: auth_request runs BEFORE the
    # request body is forwarded, so an unadmitted caller is refused without this
    # container first accepting 200 MiB of their recording.
    #
    # `internal` means a browser cannot request this path directly. The body is
    # dropped: the handler only reads the cookie, and forwarding a 200 MiB
    # recording to it would be absurd.
    #
    # With no password configured /api/access-check answers 204 to everything, so
    # an install that chose to stay open is unaffected.
    location = /_access_check {
        internal;

        # The subrequest is checked against THIS location's body-size limit,
        # using the size the client declared on the parent request — and
        # `proxy_pass_request_body off` does not exempt it. Without this line
        # the default 1m applied, so posting a meeting recording produced 413
        # on the subrequest, which nginx reports to the client as 500:
        #
        #   client intended to send too large body: 3214792 bytes,
        #   subrequest: "/_access_check"
        #   auth request unexpected status: 413
        #
        # Live-transcript chunks are ~200 KB and stayed under the limit, so
        # only whole-meeting captures failed, and only the longer ones — it
        # read as intermittent (found 2026-09-23, after a curl test with a
        # tiny body had passed). 0 disables the check, which is right for a
        # subrequest whose body is never forwarded anywhere.
        client_max_body_size 0;

        resolver 127.0.0.11 valid=30s;
        set $access_check_upstream http://api:8787;

        proxy_pass              $access_check_upstream/api/access-check;
        proxy_http_version      1.1;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Host            $host;
        proxy_set_header        X-Original-URI  $request_uri;
    }

    # ── /api/capture/transcribe ─────────────────────────────────────────────
    #
    # Live-transcript chunks (T4.7). This used to be proxied straight to
    # capture-service, which meant the deployment could not choose a provider for
    # audio at all: nginx had already decided. It now goes to the `api` container
    # like every other /api/* path, and lib/ai/router.ts decides — the built-in
    # Whisper, a cloud transcription API, an OpenAI-compatible gateway on the
    # company network, or an enterprise webhook.
    #
    # It keeps its own location rather than falling into the generic /api/ block
    # for two reasons that are both about the body: a chunk is ~8 s of audio so
    # 10m is the right ceiling and 200m is not, and one Whisper pass wants 120s
    # rather than the 300s a poll wants.
    #
    # Rate-limit arithmetic (proxy.conf): 30 req/min burst 20 on /api/capture/.
    # One chunk per 8 s = 7.5 req/min, well within the limit even with the burst
    # headroom. No separate zone needed.
    location = /api/capture/transcribe {
        limit_except POST { deny all; }

        # Refused with 401 when this deployment has a front-door password and the
        # caller has not entered it. See /_access_check above.
        auth_request /_access_check;

        resolver 127.0.0.11 valid=30s;
        set $transcribe_upstream http://api:8787;

        # No URI part, so the path is forwarded exactly as it arrived — which is
        # what server/vercelShim.ts routes on.
        proxy_pass $transcribe_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # A live chunk is ~8 s of Opus audio, well under 1 MiB. 10m matches the
        # MAX_UPLOAD_BYTES in api/capture/transcribe.ts, which is now the layer
        # that enforces it.
        client_max_body_size 10m;
        proxy_request_buffering off;
        # One transcription pass over a few seconds of audio.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── /api/capture/local ────────────────────────────────────────────────────
    #
    # ABOVE the /api/ block, and no longer a bypass. This was the one path nginx
    # streamed straight to capture-service, to keep a 200 MiB recording out of the
    # Node process. Batch BF of docs/plan/14-rooms-models-admin-ai.md moved it into
    # the api, because a deployment can now transcribe a whole meeting with one AI
    # and extract its cards with another — and a proxy cannot make that choice.
    #
    # The cost is real and worth naming: the api container holds the recording in
    # memory while it parses the multipart body. docker-compose gives `api` no
    # memory limit of its own, so a 200 MiB meeting is the sizing case for that
    # container. The benefit is that the browser still posts to the same
    # same-origin URL and still never learns which AI answered, or what credential
    # was used to reach it.
    #
    # `resolver` + a VARIABLE upstream is still required, for the same reason it
    # always was: a literal `proxy_pass http://api:8787` is resolved when nginx
    # parses the config, so one unknown hostname would stop the whole app
    # container starting. 127.0.0.11 is Docker's embedded DNS.
    location = /api/capture/local {
        limit_except POST { deny all; }

        # Refused with 401 when this deployment has a front-door password and the
        # caller has not entered it — and refused BEFORE the recording is
        # forwarded. See /_access_check above.
        auth_request /_access_check;

        resolver 127.0.0.11 valid=30s;
        set $capture_upstream http://api:8787;

        proxy_pass $capture_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # MAX_UPLOAD_BYTES in api/capture/local.ts is 200 MiB, which is also
        # capture-service's own CAPTURE_MAX_UPLOAD_BYTES default (209715200).
        # nginx must not be the layer that rejects a legitimate recording first, or
        # the handler's own legible `upload_too_large` is never reached.
        client_max_body_size 200m;
        # Streamed rather than spooled: the app container has no volume for a
        # 200 MiB body, and buffering would add the whole upload to the time before
        # the api sees its first byte.
        proxy_request_buffering off;
        # Transcription plus an extraction over a whole meeting is minutes, and
        # both halves may now be a slow model on someone else's hardware.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ── /api/capture/summary ────────────────────────────────────────────────
    #
    # The third AI job: transcript and cards in, meeting minutes out. It needs its
    # own location for one reason — time. A summary is a single call over a whole
    # meeting's transcript, which on a small model on CPU is the slowest thing this
    # app asks an AI to do, and the generic /api/ block's 300s would cut it off
    # mid-answer. The body is small (a transcript and a card list, no audio), so
    # it inherits nothing unusual.
    location = /api/capture/summary {
        limit_except POST { deny all; }

        auth_request /_access_check;

        resolver 127.0.0.11 valid=30s;
        set $summary_upstream http://api:8787;

        proxy_pass $summary_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        client_max_body_size 10m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ── /api/models ─────────────────────────────────────────────────────────
    #
    # ABOVE the /api/ block, like the two capture locations. A prefix location
    # beats a shorter prefix on nginx's own matching rules, so this answers both
    # POST /api/models and GET /api/models/<hash> and the generic /api/ block
    # never sees either.
    #
    # Unlike /api/capture/*, both directions DO go to the `api` container. An
    # upload has to be hashed and written to the models-data volume, and a
    # download has to check the front-door password and read that volume's
    # sidecar for the file's original name — neither is something nginx can do.
    location /api/models {
        resolver 127.0.0.11 valid=30s;
        set $models_upstream http://api:8787;

        # No URI part, so the path is forwarded exactly as it arrived.
        proxy_pass         $models_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;

        # MAX_MODEL_UPLOAD_BYTES in api/_lib/models.ts is 200 MiB, which is also
        # what utils/modelFormats.ts allows a CAD assembly to be. nginx must not
        # be the layer that refuses a legitimate import first, or the handler's
        # own legible `file_too_large` is never reached and the browser sees a
        # bare 413 from a proxy.
        client_max_body_size 200m;
        # Streamed rather than spooled: the app container has no volume for a
        # 200 MiB body, and buffering would add the whole upload to the time
        # before the api sees its first byte.
        proxy_request_buffering off;

        # A 200 MB import over an office uplink, and the same file going back
        # out to a room full of browsers. The /api/ block's 300s is for polls.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;

        # NO `add_header Cache-Control "no-store"` here, and that omission is
        # deliberate: /api/ has one, and add_header in a location REPLACES the
        # inherited set rather than adding to it. The download handler answers a
        # content-addressed file with `public, max-age=31536000, immutable`, and
        # a no-store beside it would be read as one header listing both — so
        # every client in the room would re-fetch the model on every reload,
        # which is the exact cost storing it by hash was meant to remove.
    }

    # ── /api/* ──────────────────────────────────────────────────────────────
    #
    # Proxied to the `api` service (server/api-server.ts running the same
    # api/*.ts files Vercel runs). NEVER the SPA fallback below: a static
    # try_files would answer /api/public-config with index.html, and the
    # browser would choke on response.json() with a bare SyntaxError.
    #
    # Resolved per request (resolver + variable), like /api/capture/local
    # above, so this container still starts while `api` is building or down;
    # a request then gets nginx's 502, which the API clients treat as
    # "unavailable" and fall back from.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:8787;

        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        # A cloud capture extraction or an Onshape translation poll can take
        # minutes; the handlers set their own shorter limits.
        proxy_read_timeout 300s;
        # Model imports and capture uploads are large.
        client_max_body_size 200m;
        add_header Cache-Control "no-store" always;
    }

    # Vite emits content-hashed filenames under /assets, so these never change
    # identity without changing name. `immutable` stops a browser re-asking.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Large binaries: no point buffering a GLB through nginx's memory.
    location ~* \.(glb|gltf|bin|woff2?)$ {
        expires    7d;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # ── The SPA ─────────────────────────────────────────────────────────────
    # index.html itself must never be cached, or a deploy serves stale HTML that
    # points at asset filenames the new image no longer contains.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # A health probe for nginx-proxy and for `docker compose ps`, which does not
    # depend on the SPA bundle having been copied correctly.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
