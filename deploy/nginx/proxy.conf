# The `nginx-proxy` container: TLS termination for the whole stack.
#
# The ONLY service in docker-compose.yml that publishes a public port. Every
# other service is reached through here or not at all, which is what makes
# "capture-service is not exposed" a property of the topology rather than a
# convention somebody has to remember.
#
# Certificates come from ./deploy/certs on the host (mounted read-only), which
# install.sh populates with a self-signed pair for the hostname you gave it.

# WebSocket upgrades. Without this map, an `Upgrade: websocket` request is
# proxied as a plain HTTP/1.0 GET and PartyKit's socket closes immediately.
# Per-client rate limit for the capture endpoints. They make this deployment
# transcribe audio (capture-service) or spend a cloud AI key (extract), and the
# app has no user login to gate them on, so anyone who can reach the site can
# call them. Keyed on the real client address, which only this proxy sees.
# Generous for real use (one request per meeting summary, a few per minute for
# live extraction windows); it exists to stop a loop or a script.
limit_req_zone $binary_remote_addr zone=capture:10m rate=30r/m;

# ── Sign-in rate limit (GoTrue, /auth/v1/token) ─────────────────────────────
#
# The token endpoint is the only place in this stack where an unauthenticated
# caller can attempt a password guess, so it gets a much tighter zone than
# capture's: 10 attempts a minute per client address, plus a burst of 10 for a
# team behind one NAT address. A person signing in needs one request; a
# password-spraying script needs thousands, and /auth/v1/token is what it aims
# at. Only reached when the `identity` compose profile is on.
#
# Keyed on a map, not applied to the whole /auth/v1/ location, because every
# other GoTrue route (/settings, /authorize, /callback, /logout, /recover) is
# part of one ordinary sign-in and must not share a bucket with the password
# attempts. An EMPTY key means nginx applies no limit at all, which is what the
# default branch gives every request that is not for the token endpoint.
# Keyed on $request_uri, NOT $uri: the /auth/v1/ location rewrites $uri to
# "/token" before the limit is evaluated (rewrite runs before preaccess), so a
# $uri map never matched and the limit silently did nothing — found live.
map $request_uri $auth_token_limit_key {
    default                          "";
    ~^/auth/v1/token(/|\?|$)         $binary_remote_addr;
}
limit_req_zone $auth_token_limit_key zone=auth_token:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Port 80: redirect, never serve ──────────────────────────────────────────
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # ACME challenge first, so a real Let's Encrypt cert can be issued without
    # the redirect breaking validation.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the app ───────────────────────────────────────────────────────
server {
    listen       443 ssl;
    listen  [::]:443 ssl;
    http2        on;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Deliberately NOT sent by default. HSTS on a self-signed certificate for an
    # internal hostname pins browsers to a TLS identity they were warned about,
    # and undoing it means waiting out max-age on every machine that visited.
    # Uncomment once a certificate from a real CA is mounted instead:
    #
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # A recording upload is the largest body this stack proxies, and
    # CAPTURE_MAX_UPLOAD_BYTES defaults to 200 MiB. nginx's 1 MiB default would
    # reject a meeting with a 413 before capture-service ever saw it.
    client_max_body_size 256m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Capture: rate-limited, and allowed to run as long as the inner layers
    # (deploy/nginx/app.conf and api/capture/local.ts wait 900 s). With the
    # 300 s default below, a long meeting transcribed on CPU was cut off here
    # while capture-service was still working.
    location /api/capture/ {
        limit_req        zone=capture burst=20 nodelay;
        limit_req_status 429;

        # Resolved per request, never once at start-up: a literal
        # `proxy_pass http://app:80` pins the IP nginx saw when IT started, so
        # any `compose up` that recreated app but not nginx-proxy (an installer
        # re-run, an upgrade) left the whole site answering 502. No URI part,
        # so the original request URI is passed through unchanged.
        resolver 127.0.0.11 valid=10s;
        set $app_upstream http://app:80;
        proxy_pass         $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ── PostgREST (supabase-js /rest/v1/) ──────────────────────────────────
    #
    # The REST API the browser's supabase-client talks to for tracker and
    # review_curation CRUD. Resolved per request (resolver + variable), like
    # /api/capture/local in app.conf, so nginx-proxy starts even when the rest
    # container is still building or down; a request then gets nginx's 502,
    # which supabase-js treats as "unavailable" and retries.
    location /rest/v1/ {
        resolver 127.0.0.11 valid=30s;
        set $rest_upstream http://rest:3000;

        # With a variable in proxy_pass nginx does NOT replace the matched
        # prefix: the request would reach PostgREST as "/" whatever the path.
        # Strip /rest/v1 explicitly; the query string is kept.
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass         $rest_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Supabase Realtime (WebSocket) ──────────────────────────────────────
    #
    # The WebSocket endpoint lib/curationsRepo.ts uses for presence (who is
    # editing) and postgres_changes (live sync of review_curations). The
    # realtime service derives its tenant from the Host header; sending
    # `Host: realtime-dev` selects the seeded tenant. Without Realtime the app
    # falls back to 5 s polling, so this location must never break the REST
    # tables above.
    #
    # proxy_read_timeout is 1h: a review session can run for hours, and
    # nginx's 60s default would drop idle sockets and rely on the client's
    # reconnect, which is the unexplained reconnect churn the observability
    # docs ask you to watch for.
    location /realtime/v1/ {
        resolver 127.0.0.11 valid=30s;
        set $realtime_upstream http://realtime:4000;

        # Same as /rest/v1/: map /realtime/v1/<x> to /socket/<x> by hand.
        rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
        proxy_pass         $realtime_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              realtime-dev;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ── Supabase Auth (GoTrue): /auth/v1/ ────────────────────────────────
    #
    # Sign-up, sign-in, token refresh and the SSO redirect for a deployment
    # that answered "accounts" or "sso" to install.sh (docs/plan/13-identity.md).
    # supabase-js in the browser is pointed at THIS origin, so the browser never
    # learns where GoTrue runs and a deployment can move it without a rebuild.
    #
    # Profile-gated: the `auth` service exists only when COMPOSE_PROFILES
    # includes `identity`. This location is written exactly like /rest/v1/ above
    # — resolver + variable + explicit rewrite — so nginx-proxy still starts
    # with the profile off, and a request then gets nginx's 502 rather than
    # holding up the rest of the site. That is the correct answer, not a
    # degraded one: identity off is a configuration, and every other route here
    # keeps working.
    location /auth/v1/ {
        # The sign-in rate limit. It only bites on /auth/v1/token — the map at
        # the top of this file gives every other URI an empty key, and nginx
        # applies no limit at all to an empty one. 429 rather than nginx's
        # default 503, so a client can tell "too many attempts, slow down" from
        # "the auth service is down".
        limit_req        zone=auth_token burst=10 nodelay;
        limit_req_status 429;

        resolver 127.0.0.11 valid=30s;
        set $auth_upstream http://auth:9999;

        # Same reason as /rest/v1/: with a variable in proxy_pass nginx does not
        # replace the matched prefix, so strip /auth/v1 explicitly. GoTrue
        # mounts its routes at the root (/signup, /token, /authorize,
        # /callback, /logout, /health); the query string is kept, which is what
        # carries grant_type and the SSO code.
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass         $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        # Resolved per request, never once at start-up: a literal
        # `proxy_pass http://app:80` pins the IP nginx saw when IT started, so
        # any `compose up` that recreated app but not nginx-proxy (an installer
        # re-run, an upgrade) left the whole site answering 502. No URI part,
        # so the original request URI is passed through unchanged.
        resolver 127.0.0.11 valid=10s;
        set $app_upstream http://app:80;
        proxy_pass         $app_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # /api/* is answered by the `app` container itself (see
        # deploy/nginx/app.conf, which returns an explicit JSON 501 until a
        # self-hosted API runtime exists). Proxying it through here unchanged
        # keeps that answer honest instead of turning it into an SPA fallback.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ── Port 8443: PartyKit WebSocket ───────────────────────────────────────────
#
# A separate port rather than a path, because lib/usePartyPresence.ts builds
# `new PartySocket({ host: VITE_PARTYKIT_HOST, room })` and partysocket connects
# to `<host>/<room>` — the room id IS the first path segment, so there is no
# prefix nginx could mount PartyKit under without the app knowing about it.
#
# This is also what makes an HTTPS deployment work at all: partysocket chooses
# wss:// because the page is https, and a page served over TLS cannot open
# ws:// to port 1999 (mixed content — the browser blocks it silently). Point
# VITE_PARTYKIT_HOST at `<hostname>:8443` and the socket is wss:// end to end.
server {
    listen       8443 ssl;
    listen  [::]:8443 ssl;
    server_name  _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        # Per request, for the same reason as `app` in the 443 server above.
        resolver 127.0.0.11 valid=10s;
        set $partykit_upstream http://partykit:1999;
        proxy_pass         $partykit_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A review session is hours long. nginx's 60s default would drop an
        # idle room's socket and rely on partysocket's reconnect to paper over
        # it, which is how a deployment ends up with unexplained reconnect
        # churn in the metrics docs/plan/05-observability-and-metrics.md §4 asks
        # you to watch.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
