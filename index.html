<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Viewpoint Arena</title>
    <style>
      /* ========================================
         SCANDINAVIAN MINIMAL DESIGN SYSTEM
         Inspired by Teenage Engineering / Polestar
         ======================================== */

      :root {
        /* Core palette - warm off-whites and pure blacks */
        --color-bg: #FAFAFA;
        --color-surface: #FFFFFF;
        --color-surface-elevated: #FFFFFF;
        --color-border: #E8E8E8;
        --color-border-subtle: #F0F0F0;
        --color-text-primary: #0A0A0A;
        --color-text-secondary: #6B6B6B;
        --color-text-tertiary: #999999;

        /* Accent colors - muted and sophisticated */
        --color-accent-orange: #FF6B35;
        --color-accent-blue: #0066CC;
        --color-accent-purple: #8B5CF6;
        --color-accent-green: #10B981;
        --color-accent-red: #EF4444;

        /* Shadows - subtle and layered */
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
        --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08);

        /* Transitions - smooth and deliberate */
        --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
        --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);

        /* Border radius - subtle roundness */
        --radius-sm: 4px;
        --radius-md: 6px;
        --radius-lg: 8px;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text-primary);
        margin: 0;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.01em;
        /* Fix mobile viewport height (accounts for dynamic browser chrome) */
        height: 100dvh;
        position: fixed;
        width: 100%;
        /* Prevent iOS bounce scroll */
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }

      #root {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      .font-mono {
        font-family: 'JetBrains Mono', 'SF Mono', 'Roboto Mono', monospace;
        letter-spacing: -0.02em;
      }

      /* Scandinavian scrollbar - minimal and elegant */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D4D4D4;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ABABAB;
      }

      canvas {
        outline: none;
      }

      /* Custom focus states - subtle but visible */
      *:focus-visible {
        outline: 2px solid var(--color-accent-blue);
        outline-offset: 2px;
      }

      /* Subtle selection color */
      ::selection {
        background: rgba(0, 102, 204, 0.15);
      }

      /* Animation keyframes for refined motion */
      @keyframes subtle-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }

      @keyframes subtle-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0); }
        50% { box-shadow: 0 0 8px 2px rgba(255, 107, 53, 0.15); }
      }

      /* Utility classes for the design system */
      .te-surface {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
      }

      .te-elevated {
        background: var(--color-surface-elevated);
        border: 1px solid var(--color-border-subtle);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }

      .te-button {
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        transition: all var(--transition-fast);
      }

      .te-button:hover {
        border-color: var(--color-text-tertiary);
        box-shadow: var(--shadow-sm);
      }

      /* Recording indicator animation */
      .recording-pulse {
        animation: subtle-pulse 2s ease-in-out infinite;
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
